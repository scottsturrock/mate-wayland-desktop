# Badges: nm-applet stamps these over the device or signal icon, so they
# must be small and in a corner, not a full-size icon. The other badges
# (mobile data type, roaming, warning) keep nm-applet's own small images.
nm-secure-lock status/changes-prevent-symbolic badge
nm-vpn-active-lock status/changes-prevent-symbolic badge
