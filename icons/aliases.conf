# Panel icons: <name an applet asks for> <Yaru icon, under scalable/> [badge]
#
# Yaru only has these icons in its flat "symbolic" style, under names that
# end in -symbolic. MATE's applets ask for the plain names, so the lookup
# used to fall through to the old Humanity set. mate-wayland-desktop-icons
# copies each Yaru icon to the plain name in our icon theme.

# Volume control applet
audio-volume-muted status/audio-volume-muted-symbolic
audio-volume-low status/audio-volume-low-symbolic
audio-volume-medium status/audio-volume-medium-symbolic
audio-volume-high status/audio-volume-high-symbolic
microphone-sensitivity-muted status/microphone-sensitivity-muted-symbolic
microphone-sensitivity-low status/microphone-sensitivity-low-symbolic
microphone-sensitivity-medium status/microphone-sensitivity-medium-symbolic
microphone-sensitivity-high status/microphone-sensitivity-high-symbolic
audio-input-microphone-muted status/microphone-sensitivity-muted-symbolic
audio-input-microphone-low status/microphone-sensitivity-low-symbolic
audio-input-microphone-medium status/microphone-sensitivity-medium-symbolic
audio-input-microphone-high status/microphone-sensitivity-high-symbolic

