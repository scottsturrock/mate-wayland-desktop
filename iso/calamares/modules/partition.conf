---
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - file
initialSwapChoice: file
drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4","btrfs","xfs"]
showNotEncryptedBootMessage: false
# With disk encryption, keep /boot on its own unencrypted partition:
# Ubuntu's signed GRUB cannot unlock a LUKS2 volume to read its files.
partitionLayout:
    - name: "boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 4G
    - name: "root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
