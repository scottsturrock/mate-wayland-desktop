---
# Runs inside the newly installed system: remove what only the live image
# needs (the installer, its launcher and the live-boot tools).
dontChroot: false
timeout: 900
script:
    - "rm -f /usr/bin/mate-wayland-desktop-install /usr/share/applications/mate-wayland-desktop-install.desktop /etc/skel/Desktop/mate-wayland-desktop-install.desktop"
    - "rm -rf /etc/calamares"
    - "apt-get -y purge calamares casper"
    - "apt-get -y autoremove --purge"
