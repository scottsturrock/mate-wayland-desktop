---
# Ubuntu's calamares package ships no default for this module. Without
# these mounts, nothing run inside the new system (grub-install, apt,
# update-initramfs) can work.
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /run/systemd/resolve
      mountPoint: /run/systemd/resolve
      options: [ bind ]

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, autodefrag ]
      ssdOptions: [ compress=lzo ]

# No "discard" mount option on SSDs: Ubuntu trims weekly with fstrim.timer
# instead, which is its default and avoids continuous discards.
