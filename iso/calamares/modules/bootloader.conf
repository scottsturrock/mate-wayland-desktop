---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Must be the first word of bootloaderEntryName (branding.desc) in lower
# case: Ubuntu's boot loader packages derive the EFI folder that way on
# every update, and a different name here would leave two folders and two
# firmware entries.
efiBootloaderId: "mate"
# Calamares must not write the fallback boot loader (EFI/BOOT/BOOTX64.EFI,
# what the firmware runs when the disk itself is chosen in the boot menu).
# It would copy plain GRUB there, and Ubuntu's signed GRUB looks for its
# configuration in /EFI/ubuntu, which does not exist here: the machine
# stops at a "grub>" prompt. Ubuntu's grub-install already puts the shim
# and its fallback helper there, which find EFI/mate through BOOTX64.CSV.
installEFIFallback: false
