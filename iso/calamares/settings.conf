---
# Calamares installer sequence for mate-wayland-desktop.
modules-search: [ local ]

instances:
- id: removelive
  module: shellprocess
  config: shellprocess_removelive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  # Remove live-only software before the user account is created, so the
  # installer icon is not copied to the new user's desktop.
  - shellprocess@removelive
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - @INITRAMFS_MODULES@
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: mate-wayland-desktop
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
