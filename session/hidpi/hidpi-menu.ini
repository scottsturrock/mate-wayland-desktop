# fuzzel settings for the HiDPI Launcher (hidpi-menu), in the colours of the
# desktop. Copy to ~/.config/mate-wayland-desktop/hidpi-menu.ini to change.
[main]
font=Noto Sans:size=7
dpi-aware=yes
icon-theme=mate-wayland-desktop
icons-enabled=yes
lines=14
width=30
horizontal-pad=9
vertical-pad=7
inner-pad=4
line-height=15
prompt=HiDPI
layer=overlay

[border]
width=1
radius=10

[colors]
background=f7f7f5ff
text=2e3436ff
match=4e9a06ff
selection=87a752ff
selection-text=ffffffff
selection-match=ffffffff
border=87a752ff
