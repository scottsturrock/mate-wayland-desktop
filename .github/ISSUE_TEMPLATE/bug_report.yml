name: Problem report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: input
    id: iso
    attributes:
      label: ISO
      description: The name of the ISO file you installed or started from.
      placeholder: mate-wayland-desktop-26.04-YYYYMMDD-amd64.iso
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Computer
      description: Make and model, or the virtual machine program and version.
    validations:
      required: true
  - type: input
    id: graphics
    attributes:
      label: Graphics
      description: Graphics card or cards, and the driver if you installed one.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For display or session problems, the files in ~/.local/state/mate-wayland-desktop/. Remove anything you do not want to be public.
      render: text
